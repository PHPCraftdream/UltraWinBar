name: UltraWinBar

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    strategy:
      matrix:
        publishprofile: [ [x64, net6.0-windows], [x86, net6.0-windows], [x64, net10.0-windows], [x86, net10.0-windows], [ARM64, net10.0-windows], [x64-portable, net6.0-windows], [x86-portable, net6.0-windows], [x64-portable, net10.0-windows], [x86-portable, net10.0-windows], [ARM64-portable, net10.0-windows] ]
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install nbgv
      uses: dotnet/nbgv@v0.5.2

    - name: Publish app
      run: dotnet publish -p:PublishProfile=$env:Profile -f $env:Framework -p:DebugType=None -p:DebugSymbols=false -p:PublishDir=bin\Release\$env:Framework\publish-$env:Profile
      env:
        Profile: ${{ matrix.publishprofile[0] }}
        Framework: ${{ matrix.publishprofile[1] }}

    - name: Copy license
      run: cp DistLicense.txt UltraWinBar\bin\Release\${{ matrix.publishprofile[1] }}\publish-${{ matrix.publishprofile[0] }}\License.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: UltraWinBar ${{ matrix.publishprofile[0] == 'x86' && '32-bit' || matrix.publishprofile[0] == 'x64' && '64-bit' || matrix.publishprofile[0] == 'ARM64' && 'ARM64' || matrix.publishprofile[0] == 'x86-portable' && 'Portable 32-bit' || matrix.publishprofile[0] == 'x64-portable' && 'Portable 64-bit' || 'Portable ARM64' }}${{ matrix.publishprofile[1] == 'net6.0-windows' && ' Win7-8' || '' }}
        path: UltraWinBar\bin\Release\${{ matrix.publishprofile[1] }}\publish-${{ matrix.publishprofile[0] }}\

  installer:
    name: Installer
    needs: [ build ]
    runs-on: windows-2025

    env:
      installer: installer.iss

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download build artifacts - ARM64
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar ARM64
        path: UltraWinBar\bin\Release\net10.0-windows\publish-ARM64\

    - name: Download build artifacts - x64
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar 64-bit
        path: UltraWinBar\bin\Release\net10.0-windows\publish-x64\

    - name: Download build artifacts - x86
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar 32-bit
        path: UltraWinBar\bin\Release\net10.0-windows\publish-x86\

    - name: Download build artifacts - x64 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar 64-bit Win7-8
        path: UltraWinBar\bin\Release\net6.0-windows\publish-x64\

    - name: Download build artifacts - x86 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar 32-bit Win7-8
        path: UltraWinBar\bin\Release\net6.0-windows\publish-x86\

    - name: Compile Inno Setup installer
      run: ISCC.exe "${{ env.installer }}"

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: UltraWinBar Installer
        path: bin\UltraWinBarInstaller.exe
        
  zip-portable:
    name: ZIP Portable
    needs: [ build ]
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download build artifacts - ARM64
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar Portable ARM64
        path: UltraWinBar\portable\ARM64

    - name: Download build artifacts - x64
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar Portable 64-bit
        path: UltraWinBar\portable\64-bit

    - name: Download build artifacts - x86
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar Portable 32-bit
        path: UltraWinBar\portable\32-bit

    - name: Download build artifacts - x64 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar Portable 64-bit Win7-8
        path: UltraWinBar\portable\Win7-8\64-bit

    - name: Download build artifacts - x86 Win7-8
      uses: actions/download-artifact@v8
      with:
        name: UltraWinBar Portable 32-bit Win7-8
        path: UltraWinBar\portable\Win7-8\32-bit

    - name: Upload ZIP
      uses: actions/upload-artifact@v7
      with:
        name: UltraWinBar Portable
        path: UltraWinBar\portable\